<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Form Validation</title>
    <style>
      body{
        font-family:sans-serif;
        line-height:1.6;
        margin:0;
        padding:20px;
        color:#222;
      }
      .container{
        max-width:500px;
        margin:auto;
        padding:20px;
        border:1px solid #ddd;
        border-radius:8px;
        background:#fafafa;
      }
      h2{
        color:#0066cc;
        margin-top:0;
      }
      .form-group{
        margin-bottom:15px;
      }
      label{
        display:block;
        margin-bottom:5px;
        font-weight:bold;
      }
      input,textarea{
        width:100%;
        padding:8px;
        box-sizing:border-box;
        border:1px solid #ccc;
        border-radius:4px;
        font-size:1rem;
      }
      .error-msg{
        color:#dc2626;
        font-size:0.85rem;
        display:none;
        margin-top:4px;
      }
      button{
        background-color:#0066cc;
        color:#fff;
        border:none;
        padding:10px 18px;
        border-radius:4px;
        cursor:pointer;
        font-size:1rem;
      }
      button:hover{
        background-color:#0052a3;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Contact Form</h2>
      <form id="contactForm">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" placeholder="Enter your full name"/>
          <div id="nameError" class="error-msg">Name must be at least 3 characters long.</div>
        </div>
        <div class="form-group">
          <label for="emailAddr">Email Address</label>
          <input type="text" id="emailAddr" placeholder="Enter your email address"/>
          <div id="emailError" class="error-msg">Please enter a valid email address.</div>
        </div>
        <div class="form-group">
          <label for="messageText">Message</label>
          <textarea id="messageText" rows="4" placeholder="Enter your message"></textarea>
          <div id="msgError" class="error-msg">Message must be at least 10 characters long.</div>
        </div>
        <button type="submit">Submit</button>
      </form>
    </div>
    <script>
      const form=document.getElementById("contactForm");
      form.addEventListener("submit", function(event){
        event.preventDefault();
        const nameInput=document.getElementById("fullName").value.trim();
        const emailInput=document.getElementById("emailAddr").value.trim();
        const msgInput=document.getElementById("messageText").value.trim();
        const nameError=document.getElementById("nameError");
        const emailError=document.getElementById("emailError");
        const msgError=document.getElementById("msgError");
        const emailRegex=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        let isValid=true;
        if(nameInput.length<3){
          nameError.style.display="block";
          isValid=false;
        }
        else{
          nameError.style.display="none";
        }
        if(!emailRegex.test(emailInput)){
          emailError.style.display="block";
          isValid=false;
        }
        else{
          emailError.style.display="none";
        }
        if(msgInput.length<10){
          msgError.style.display="block";
          isValid=false;
        }
        else{
          msgError.style.display="none";
        }
        if(isValid){
          alert("Form submitted successfully!");
          form.reset();
        }
      });
    </script>
  </body>
</html>
