<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>

        padding:20px 0;

      h1,h2{

      }

        background:#f4f4f4;

  <body>
    <header>
      <h1>Test Name 1</h1>

        <p>I build web applications focusing on HTML5, CSS3, modern JavaScript, and React.</p>
      </section>
      <section id="projects">
        <h2>Projects</h2>
        <div class="card">
          <h3>E-Commerce UI</h3>
          <p>A responsive shopping interface built with clean CSS.</p>
        </div>
        <div class="card">
          <h3>Task Tracker</h3>
          <p>A vanilla JavaScript state-driven application.</p>
        </div>
      </section>
    </main>
    <footer>
      <p>&copy; 2026 Test Name 1</p>
